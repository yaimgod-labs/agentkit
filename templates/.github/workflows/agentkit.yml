# agentkit caller — all logic lives in your-org/agentkit (pinned @v1).
# Each job loads the kit's scripts and plugin from the same commit as its `uses:`.
# Jobs also accept `model` and `plugins` (NAME@agentkit, or NAME@<marketplace in this repo's .claude-plugin/marketplace.json>).
name: agentkit

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  # results from other CI apps (CircleCI, Buildkite, Jenkins, …) re-run the review gate
  check_run:
    types: [completed]
  status:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 7 * * *"  # daily digest (UTC)
    - cron: "0 8 * * 1"  # weekly retro (UTC, Mondays)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'status:')) ||
      (github.event_name == 'pull_request' && (github.event.action == 'closed' || github.event.action == 'edited')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/decide'))
    uses: your-org/agentkit/.github/workflows/dispatch.yml@v1
    with:
      wip: ${{ fromJSON(vars.AGENTKIT_WIP || '2') }}
      # debt-every: 4          # one debt issue in every 4 taken into work; 0 turns the quota off
      # debt-label: type:debt  # the label that marks debt
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}

  refine:
    # status:refining, or a person (not a bot) answering on a status:needs-info issue
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'status:refining') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'status:needs-info'))
    uses: your-org/agentkit/.github/workflows/refine.yml@v1
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: >-
      github.event_name == 'issues' &&
      (github.event.label.name == 'status:in-progress' || github.event.label.name == 'status:changes-requested')
    uses: your-org/agentkit/.github/workflows/implement.yml@v1
    # with:
    #   plugins: |              # extra pinned plugins for this job only (ponytail and caveman are built in)
    #     some-skills@my-project
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  plan:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/plan')
    uses: your-org/agentkit/.github/workflows/plan.yml@v1
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    # PR pushes run the full review; other CI apps' results and the schedule re-run only its gate
    # (check runs made by GitHub Actions are skipped, so the gate never triggers itself)
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.action != 'edited' && !github.event.pull_request.draft) ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug != 'github-actions') ||
      github.event_name == 'status' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: your-org/agentkit/.github/workflows/review.yml@v1
    # with:
    #   plugins: |
    #     review-checklist@my-project
    #   # a monorepo: one suite per part, each on its own runner; only suites whose paths changed run
    #   suites: >-
    #     [{"name": "api", "paths": ["api/**"], "runs-on": "ubuntu-latest", "run": "cd api && npm ci && npm test"},
    #      {"name": "cli", "paths": ["cli/**"], "runs-on": "macos-latest", "run": "cd cli && make test"}]
    #   # checks another CI app posts on the commit; the gate waits for them (check-timeout, default 60 min)
    #   external-checks: >-
    #     [{"name": "mobile-ci", "paths": ["mobile/**"]}]
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  digest:
    if: github.event.schedule == '0 7 * * *'
    uses: your-org/agentkit/.github/workflows/digest.yml@v1
    # with:
    #   statuses: |            # one `label|heading` per line, any labels; default: the statuses that wait on a person
    #     status:needs-human|Handed over to you
    #     priority:high|Urgent
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  retro:
    if: github.event.schedule == '0 8 * * 1'
    uses: your-org/agentkit/.github/workflows/retro.yml@v1
    # with:
    #   days: 14               # default 7 (also change the cron above)
    #   category: Retros       # Discussions category, default General
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
