# agentkit CANARY caller: tracks agentkit main (scripts/canary.sh). Real projects pin @v1.
name: agentkit

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  # a person's "Request changes" review sends an agent PR back to the implementer
  pull_request_review:
    types: [submitted]
  # results from other CI apps (CircleCI, Buildkite, Jenkins, …) re-run the review gate
  check_run:
    types: [completed]
  status:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 7 * * *"  # daily digest (UTC)
    - cron: "0 8 * * 1"  # weekly retro (UTC, Mondays)
  workflow_dispatch:
  # the Slack bot's button clicks (slack-bot interface)
  repository_dispatch:
    types: [agentkit-slack-reply]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'status:')) ||
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'pull_request' && (github.event.action == 'closed' || github.event.action == 'edited')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/decide'))
    uses: example-org/agentkit/.github/workflows/dispatch.yml@main
    with:
      agentkit-ref: main
      wip: ${{ fromJSON(vars.AGENTKIT_WIP || '2') }}
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened' && vars.AGENTKIT_INTERFACE == 'claude-slack'
    uses: example-org/agentkit/.github/workflows/triage.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}

  refine:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'status:refining') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'status:needs-info') &&
       vars.AGENTKIT_INTERFACE != 'claude-slack')
    uses: example-org/agentkit/.github/workflows/refine.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  implement:
    if: >-
      github.event_name == 'issues' &&
      (github.event.label.name == 'status:in-progress' || github.event.label.name == 'status:changes-requested')
    uses: example-org/agentkit/.github/workflows/implement.yml@main
    with:
      agentkit-ref: main
      plugins: |
        ponytail@agentkit
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  plan:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/plan')
    uses: example-org/agentkit/.github/workflows/plan.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  reply:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'agentkit-slack-reply' &&
       vars.AGENTKIT_SLACK_BOT == 'true') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && !startsWith(github.event.comment.body, '/') &&
       vars.AGENTKIT_INTERFACE == 'claude-slack' &&
       (contains(github.event.issue.labels.*.name, 'action:required') ||
        contains(github.event.issue.labels.*.name, 'status:blocked')))
    uses: example-org/agentkit/.github/workflows/reply.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}

  card:
    # Slack bot mode (AGENTKIT_SLACK_BOT=true): an issue that starts waiting on a person gets one short card,
    # and its cards are resolved when it gets a new status or closes
    if: >-
      github.event_name == 'issues' && vars.AGENTKIT_SLACK_BOT == 'true' &&
      (github.event.action == 'closed' ||
       (github.event.action == 'labeled' &&
        (github.event.label.name == 'action:required' || startsWith(github.event.label.name, 'status:'))))
    uses: example-org/agentkit/.github/workflows/card.yml@main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  review:
    # PR pushes run the full review; other CI apps' results and the schedule re-run only its gate
    # (check runs made by GitHub Actions are skipped, so the gate never triggers itself)
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.action != 'edited' && !github.event.pull_request.draft) ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug != 'github-actions') ||
      github.event_name == 'status' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: example-org/agentkit/.github/workflows/review.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  digest:
    if: github.event.schedule == '0 7 * * *'
    uses: example-org/agentkit/.github/workflows/digest.yml@main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  retro:
    if: github.event.schedule == '0 8 * * 1'
    uses: example-org/agentkit/.github/workflows/retro.yml@main
    with:
      agentkit-ref: main
    secrets:
      AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
