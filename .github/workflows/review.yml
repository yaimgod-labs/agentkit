# Reviews: code + security (Claude, separate fresh-context jobs, read-only repo
# access), integration (the project's test script, or the `suites` whose paths
# changed) and docs, then a gate that judges every check on the PR's head commit,
# external ones included, and moves the linked issue to status:approved, back to
# the implementer, or to a human. The gate alone also runs on check_run, status,
# schedule and workflow_dispatch events, to pick up results that arrive later.
name: agentkit-review

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts and the plugin from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
      model:
        description: Claude model for every agent in this workflow
        type: string
        default: claude-opus-5-5
      plugins:
        description: Extra plugins (newline list of NAME@MARKETPLACE — `agentkit` for the kit's pinned externals, or the name in this repo's .claude-plugin/marketplace.json)
        type: string
        default: ""
      max-turns:
        type: number
        default: 40
      max-rounds:
        description: Failed review rounds before the issue goes to status:needs-human
        type: number
        default: 3
      suites:
        description: >-
          JSON list of test suites, each {"name", "paths": [globs], "runs-on", "run"}; only suites with a changed
          path run (no `paths` = always). Empty = one `integration` job running .agentkit/test.sh
        type: string
        default: ""
      external-checks:
        description: >-
          JSON list of checks other apps post on the commit (check runs or commit statuses), each {"name", "paths"};
          the gate waits for those whose paths changed
        type: string
        default: ""
      check-timeout:
        description: Minutes after the head commit a check may stay pending or missing before the issue goes to a human
        type: number
        default: 60
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    # forks get no secrets; same-repo PRs only
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read  # checkout of a private repo
    strategy:
      fail-fast: false
      matrix:
        kind: [code, security]
    concurrency:
      group: agentkit-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ matrix.kind }}
      cancel-in-progress: true
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
          permission-actions: read

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: review.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD
          if [ -d .git ]; then echo .agentkit-kit/ >>.git/info/exclude; fi
          # a project marketplace (.claude-plugin/marketplace.json) adds the project's own pinned plugins
          if [ -f .claude-plugin/marketplace.json ]; then echo "project-marketplace=$GITHUB_WORKSPACE" >>"$GITHUB_OUTPUT"; fi

      # give the reviewer its inputs as files, so it never needs GitHub access to judge the criteria
      - name: Collect review context
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p .agentkit-review
          body=$(gh pr view "$PR" --repo "$REPO" --json title,body --jq '"# PR: \(.title)\n\n\(.body)"')
          printf '%s\n' "$body" >.agentkit-review/pr.md
          # an RFC's /decide comments, so the reviewer can check the decision record against them
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | test("^/decide (accept|reject)"; "i")) | "\n## Decision comment by \(.user.login)\n\n\(.body)\n"' >>.agentkit-review/pr.md
          n=$(sed -nE 's#^agent/([0-9]+)-.*#\1#p' <<<"$HEAD")
          [ -n "$n" ] || n=$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$body" | head -n1 | grep -oE '[0-9]+' || true)
          # --json, not --comments: piped, --comments prints only the comments (no title, body or criteria)
          if [ -n "$n" ]; then gh issue view "$n" --repo "$REPO" --json number,title,labels,body,comments \
            --jq '"# Issue #\(.number): \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)\n\n## Comments\n" + ([.comments[] | "\n### \(.author.login)\n\n\(.body)\n"] | join(""))' >.agentkit-review/issue.md
          # `gh agentkit upgrade` PRs have no issue: their criteria are the upgrade's own contract
          elif [[ $HEAD == agentkit/upgrade-* ]]; then printf '%s\n' "# Kit upgrade (gh agentkit upgrade), no issue" "" \
            "## Acceptance criteria" \
            "- [ ] .github/workflows/agentkit.yml changes only triggers and kit jobs' if:/secrets:; every job keeps its uses: ref and with: block, and project-only jobs stay" \
            "- [ ] other files are only added, except .claude/settings.json, whose plugin settings may be re-synced" \
            >.agentkit-review/issue.md
          else echo "No linked issue." >.agentkit-review/issue.md; fi
          [ -s .agentkit-review/issue.md ] || { echo "::error::linked issue export is empty"; exit 1; }
          git diff "origin/$BASE...HEAD" >.agentkit-review/diff.patch
          # a fix round: the findings that sent earlier rounds back, and what changed since the last round's
          # commit (named in its marker), so the reviewer checks those fixes instead of re-judging settled code
          prev=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | test("^<!-- agentkit:(round|review-)")) | "\n## \(.created_at)\n\n\(.body)\n"')
          if [ -n "$prev" ]; then
            printf '%s\n' "$prev" >.agentkit-review/previous.md
            last=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' \
              | sed -nE 's/^<!-- agentkit:round ([0-9a-f]{40}) -->.*/\1/p' | tail -n1)
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
              git diff "$last" "$HEAD_SHA" >.agentkit-review/since-last-round.patch
            fi
          fi
          wc -c .agentkit-review/*

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          # agent PRs are opened and pushed by our App
          allowed_bots: ${{ steps.app.outputs.app-slug }}
          plugin_marketplaces: |
            ${{ github.workspace }}/.agentkit-kit
            ${{ steps.kit.outputs.project-marketplace }}
          plugins: |
            agentkit@agentkit
            ${{ inputs.plugins }}
          prompt: |
            Repository ${{ github.repository }}, pull request #${{ github.event.pull_request.number }},
            base branch origin/${{ github.event.pull_request.base.ref }}.
            Your inputs: .agentkit-review/pr.md (PR description), .agentkit-review/issue.md (linked issue with its
            acceptance criteria and comments), .agentkit-review/diff.patch (the diff). Read all three first, and in a
            fix round also .agentkit-review/previous.md and .agentkit-review/since-last-round.patch if they exist.
            Use the agentkit:review-${{ matrix.kind }} skill. You are read-only: never edit files, commit or push.
            Post findings as inline comments on the PR, then return the verdict.
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools Bash(git:*),Read,Glob,Grep,Skill,mcp__github_inline_comment__create_inline_comment
            --json-schema '{"type":"object","required":["verdict","summary"],"properties":{"verdict":{"enum":["pass","fail"]},"summary":{"type":"string"}}}'

      - name: Usage
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true  # usage logging never fails a run
        uses: ./.agentkit-kit/.github/actions/usage
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          job: review-${{ matrix.kind }}
          model: ${{ inputs.model }}

      - name: Verdict
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          KIND: ${{ matrix.kind }}
        run: |
          verdict=$(jq -r '.verdict // "fail"' <<<"${OUT:-{\}}")
          summary=$(jq -r '.summary // "no summary: the reviewer returned no verdict"' <<<"${OUT:-{\}}")
          printf '%s\n' "$summary" >>"$GITHUB_STEP_SUMMARY"
          echo "verdict: $verdict"
          # check runs from Actions carry no text: the implementer's fix round reads the blocking findings here
          if [ "$verdict" != pass ]; then
            gh pr comment "$PR" --repo "$REPO" --body "<!-- agentkit:review-$KIND -->
          **agentkit $KIND review failed**

          $summary"
          fi
          [ "$verdict" = "pass" ]

  integration:
    if: github.event.pull_request.head.repo.full_name == github.repository && inputs.suites == ''
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: agentkit-integration-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run .agentkit/test.sh
        run: |
          if [ ! -x .agentkit/test.sh ]; then
            echo "::warning::no executable .agentkit/test.sh — integration check skipped"
            exit 0
          fi
          .agentkit/test.sh

  # suites: only those whose paths the PR changes
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository && inputs.suites != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-actions: read
          permission-pull-requests: read

      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: review.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      - id: pick
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SUITES: ${{ inputs.suites }}
        run: |
          picked=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | python3 .agentkit-kit/scripts/checks.py select "$SUITES")
          echo "suites: $(jq -r '[.[].name] | join(", ")' <<<"$picked")"
          echo "suites=$picked" >>"$GITHUB_OUTPUT"

  suite:
    needs: changes
    if: needs.changes.outputs.suites != '[]' && needs.changes.outputs.suites != ''
    name: integration (${{ matrix.suite.name }})
    runs-on: ${{ matrix.suite.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    concurrency:
      group: agentkit-suite-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ matrix.suite.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run suite
        env:
          RUN: ${{ matrix.suite.run }}
        run: bash -c "$RUN"

  # docs/ consistency: schema, links, index, docs whose `covers` code changed, CLAUDE.md line budgets (see scripts/docs.py)
  docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: agentkit-docs-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: read

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: review.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD
          if [ -d .git ]; then echo .agentkit-kit/ >>.git/info/exclude; fi
          # a project marketplace (.claude-plugin/marketplace.json) adds the project's own pinned plugins
          if [ -f .claude-plugin/marketplace.json ]; then echo "project-marketplace=$GITHUB_WORKSPACE" >>"$GITHUB_OUTPUT"; fi

      - name: Check docs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          k=.agentkit-kit/plugins/agentkit/scripts/docs.py
          gh pr view "$PR" --repo "$REPO" --json body --jq .body >"$RUNNER_TEMP/body.md"
          rc=0
          for args in "check" "index --check" "drift origin/$BASE --pr-body $RUNNER_TEMP/body.md"; do
            # shellcheck disable=SC2086
            python3 "$k" $args >>"$RUNNER_TEMP/docs.txt" 2>&1 || rc=1
          done
          cat "$RUNNER_TEMP/docs.txt"
          if [ "$rc" -ne 0 ]; then
            gh pr comment "$PR" --repo "$REPO" --body "<!-- agentkit:docs -->
          **agentkit docs check failed**

          $(cat "$RUNNER_TEMP/docs.txt")"
          fi
          exit "$rc"

  gate:
    needs: [review, integration, suite, docs]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'agent/')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one gate per commit at a time, so a late external result and the review run never both decide
    concurrency:
      group: agentkit-gate-${{ github.repository }}-${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || github.event.sha || 'sweep' }}
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: review.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || github.event.sha }}
          NEEDS: ${{ toJSON(needs) }}
          EXTERNAL: ${{ inputs.external-checks }}
          SUITES: ${{ inputs.suites }}
          TIMEOUT: ${{ inputs.check-timeout }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE }}
          MAX_ROUNDS: ${{ inputs.max-rounds }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # a newer push cancelled this run's reviews: that run's gate decides
          if jq -e 'any(.[]; .result == "cancelled")' <<<"$NEEDS" >/dev/null; then exit 0; fi
          C=.agentkit-kit/scripts/checks.py
          judge() {
            local pr=$1 head sha mergeable n files required doc out verdict unmet human failed
            read -r head sha mergeable < <(gh pr view "$pr" --repo "$REPO" --json headRefName,headRefOid,mergeable --jq '"\(.headRefName) \(.headRefOid) \(.mergeable)"')
            n=$(sed -nE 's#^agent/([0-9]+)-.*#\1#p' <<<"$head")
            [ -n "$n" ] || return 0
            # a PR that conflicts with its base gets no pull_request runs: send it back to the implementer,
            # which merges the base first. Not a failed round; a person's needs-human stays theirs
            if [ "$mergeable" = CONFLICTING ]; then
              gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qxE 'status:(review|approved|needs-verification)' || return 0
              gh pr comment "$pr" --repo "$REPO" --body "agentkit: this PR conflicts with its base branch. Sending back to the implementer to merge the base and resolve the conflicts."
              .agentkit-kit/scripts/set-status.sh "$REPO" "$n" status:changes-requested
              return 0
            fi
            # a newer push has its own run. Decide once: late results only move an issue still in review;
            # a push (a person's, too) re-gates an approved PR
            if [ "$EVENT" = pull_request ] && [ "$sha" != "$EVENT_SHA" ]; then return 0; fi
            local ok=status:review
            [ "$EVENT" != pull_request ] || ok='status:(review|approved|needs-verification)'
            gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qxE "$ok" || return 0
            set_status() { .agentkit-kit/scripts/set-status.sh "$REPO" "$n" "$@"; }
            files=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename')
            # the kit's own checks must report too, so a commit no review ran on never passes
            required=$( { python3 "$C" select "$EXTERNAL" <<<"$files"; python3 "$C" select "$SUITES" <<<"$files"; } \
              | jq -sc --arg suites "$SUITES" '[.[0][].name, "review (code)", "review (security)", "docs"]
                  + (if $suites == "" then ["integration"] else [.[1][] | "integration (\(.name))"] end)')
            local since statuses polls=0
            since=$(gh api "repos/$REPO/commits/$sha" --jq .commit.committer.date)
            while :; do
              gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[]' >"$RUNNER_TEMP/runs.json"
              statuses=$(gh api "repos/$REPO/commits/$sha/status" --jq .statuses 2>/dev/null) \
                || { echo "::warning::cannot read commit statuses: give the agentkit App 'Commit statuses: read'"; statuses='[]'; }
              doc=$(jq -n --slurpfile runs "$RUNNER_TEMP/runs.json" --argjson statuses "$statuses" \
                --argjson required "$required" --argjson timeout "$TIMEOUT" --arg since "$since" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{check_runs: $runs, statuses: $statuses, required: $required, since: $since, now: $now, timeout: $timeout}')
              out=$(python3 "$C" gate <<<"$doc")
              verdict=$(jq -r .verdict <<<"$out")
              # ponytail: on a push, poll ~5 min for checks still running; later results come by event or the sweep
              if [ "$verdict" != wait ] || [ "$EVENT" != pull_request ] || [ $((polls += 1)) -gt 10 ]; then break; fi
              sleep 30
            done
            # the implementer's own checklist in the PR body: an unticked criterion is a failed round;
            # unticked boxes under "## Human verification" wait for a person instead
            read -r unmet human < <(gh pr view "$pr" --repo "$REPO" --json body --jq .body | .agentkit-kit/scripts/checklist.sh)
            failed=$(jq -r '.failed[] | "- **\(.name)**: \(.detail)"' <<<"$out")
            if [ "$unmet" -gt 0 ]; then failed="$failed"$'\n'"- **PR checklist**: $unmet acceptance criteria not ticked"; verdict=fail; fi
            echo "#$pr ($sha): $verdict $(jq -c .pending <<<"$out")"
            case $verdict in
              wait) return 0 ;;
              timeout)
                gh pr comment "$pr" --repo "$REPO" --body "agentkit: still no result from $(jq -r '.pending | join(", ")' <<<"$out") after $TIMEOUT minutes ($RUN). Check that these run for this branch, then re-run them or move the issue back to \`status:review\`."
                set_status status:needs-human reason:env
                return 0 ;;
              pass)
                if [ "$human" -gt 0 ]; then
                  set_status status:needs-verification
                  gh pr comment "$pr" --repo "$REPO" --body "agentkit: all checks passed. $human item(s) under **Human verification** need a person: check them (on a device, a staging build or wherever the item says) and tick the boxes in the PR description; ticking the last one approves the PR."
                  return 0
                fi
                set_status status:approved
                if [ "$AUTO_MERGE" = true ]; then gh pr merge "$pr" --repo "$REPO" --squash --delete-branch; fi
                return 0 ;;
            esac
            local rounds
            rounds=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq '[.[]|select(.body|contains("<!-- agentkit:round"))]|length' | awk '{s+=$1} END {print s+0}')
            rounds=$((rounds + 1))
            if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "<!-- agentkit:round $sha -->
          agentkit: review round $rounds of $MAX_ROUNDS failed ($RUN). Stopping the fix loop — needs a human.

          $failed"
              set_status status:needs-human reason:agent-error
            else
              gh pr comment "$pr" --repo "$REPO" --body "<!-- agentkit:round $sha -->
          agentkit: review round $rounds of $MAX_ROUNDS failed ($RUN). Sending back to the implementer.

          $failed"
              set_status status:changes-requested
            fi
          }
          case $EVENT in
            pull_request) prs=$EVENT_PR ;;
            check_run|status) prs=$(gh api "repos/$REPO/commits/$EVENT_SHA/pulls" --jq '.[] | select(.state == "open") | .number') ;;
            # schedule / workflow_dispatch: sweep, for timeouts and results whose event never came
            *) prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("agent/")) | .number') ;;
          esac
          for pr in $prs; do judge "$pr"; done
