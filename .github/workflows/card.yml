# Slack bot mode (repo var AGENTKIT_SLACK_BOT=true, on top of AGENTKIT_INTERFACE=slack): an issue that starts
# waiting on a person (label action:required added) gets one short card in the bot's channel (scripts/card.py), and a
# hidden marker comment that names the card. When the issue stops waiting (a new status without action:required) or
# closes, every card it has is edited to the outcome, without buttons, so an old card cannot act on a new state.
# Chief of staff (scripts/card.sh): no card when a person already answered on the issue; an issue in the same blocker
# chain as one with a live card is folded into that card ("Also affects #n") and gets its own card once that one resolves.
# The channel is repo var AGENTKIT_CARD_CHANNEL; the bot token is secret SLACK_BOT_TOKEN. Neither reaches Claude.
name: agentkit-card

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  card:
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    env:
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      CHANNEL: ${{ vars.AGENTKIT_CARD_CHANNEL }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write  # the card's marker comment
          permission-actions: read  # Load agentkit reads this run's referenced workflows

      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: card.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      - name: Post or resolve the card
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          AGENTKIT_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}  # verifies Slack reply records (people.sh)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.AGENTKIT_CARD_CHANNEL }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          [ -n "$SLACK_CHANNEL" ] || { echo "::error::repo variable AGENTKIT_CARD_CHANNEL is not set"; exit 1; }
          [[ $N =~ ^[1-9][0-9]*$ ]] || { echo "::error::not an issue number"; exit 1; }
          # the kit's own comments only (gh issue view names an App by its slug, without the [bot] suffix the REST API adds):
          # a person's or an agent-as-user's text never becomes the ask, and no one else's comment can name a card
          # shellcheck disable=SC2016  # a jq filter, not shell
          kit='[.comments[] | select(.author.login == $slug or .author.login == $slug + "[bot]")]'

          if [ "$ACTION" != labeled ] || [ "$LABEL" != action:required ]; then
            issue=$(gh issue view "$N" --repo "$REPO" --json state,stateReason,title,labels,comments)
            if [ "$(jq -r .state <<<"$issue")" = OPEN ] && jq -e '[.labels[].name] | index("action:required")' <<<"$issue" >/dev/null; then
              echo "#$N still waits; its card stays"; exit 0
            fi
            n=$(jq -c --arg repo "$REPO" --argjson n "$N" --arg slug "$SLUG" \
              "{repo: \$repo, number: \$n, title, state, stateReason, labels: [.labels[].name], comments: ($kit | map(.body))}" <<<"$issue" \
              | python3 .agentkit-kit/scripts/card.py resolve)
            echo "#$N: $n card(s) resolved"
            # issues folded into those cards ("Also affects") still wait: each gets a card now (or folds elsewhere)
            [ "$n" = 0 ] || .agentkit-kit/scripts/card.sh "$REPO" "$N" refold
            exit 0
          fi

          # The status is set first and the explaining comment right after it, so the label event can arrive before
          # the comment: wait for the kit's newest comment to be after the issue's last update, for up to a minute
          # (ponytail: a poll, not an event; a card from the previous comment is the worst case).
          since=$(gh issue view "$N" --repo "$REPO" --json updatedAt --jq .updatedAt)
          for _ in 1 2 3 4 5 6; do
            issue=$(gh issue view "$N" --repo "$REPO" --json state,title,labels,comments)
            newest=$(jq -r --arg slug "$SLUG" "$kit | map(.createdAt) | max // \"\"" <<<"$issue")
            [[ -n $newest && ! $newest < $since ]] && break
            sleep 10
          done
          # the chief of staff first (card.sh): no card when a person already answered, a fold into the card of a
          # waiting issue in the same blocker chain; else the card and its marker
          .agentkit-kit/scripts/card.sh "$REPO" "$N" post
