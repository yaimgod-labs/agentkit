# Claude Code + Slack mode: a person answers a waiting issue (action:required or status:blocked) with the Comment
# button on its Slack card, and Slack's GitHub app posts that answer as an issue comment by the person's account.
# This workflow maps the comment to one action (scripts/reply.py) and carries it out (scripts/apply-reply.sh).
# The caller runs it only when AGENTKIT_INTERFACE is claude-slack or slack-bot.
# In slack-bot mode the reply arrives as a repository_dispatch event `agentkit-slack-reply` from the kit's Slack bot
# (client_payload: {issue, text, login}); `login` is the GitHub login the bot mapped the Slack user to. It is checked
# for write access here again, and the workflow writes the signed record of the reply (slackrec.py).
# The `task` job takes the bot's `+ Add task` (repository_dispatch `agentkit-slack-task`, client_payload:
# {title, body, login}): the same login check, then a new issue by the kit's App, filed straight into status:refining
# (what triage.yml gives a new issue by a trusted author), its body ending in "Filed by @login from Slack."
# Settings from Slack (scripts/settings.py, config/settings.json): the `settings` job takes a question
# (`agentkit-slack-settings`, {question, login, slack_user}) and DMs the person a card of valid options, picked by a
# model that gets only the question and the registry, with no tools. The bot applies a person's own setting itself;
# a project setting comes back as `agentkit-slack-setting` ({key, value, login, slack_user}): the `setting` job checks
# admin access and the value again, then sets the repo variable or opens a PR on the caller, and DMs the outcome.
name: agentkit-reply

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts and the plugin from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
      model:
        description: Claude model that matches a settings question to the registry
        type: string
        default: claude-opus-5-5
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:  # settings questions from the Slack bot
        required: false
      SLACK_BOT_TOKEN:  # the settings answers, DMed to the person
        required: false

permissions: {}

jobs:
  reply:
    if: github.event_name != 'repository_dispatch' || github.event.action == 'agentkit-slack-reply'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    # one reply per issue at a time. Known limit: GitHub keeps only one pending run per group, so a third quick reply
    # cancels the pending second before it starts (that run never runs a step). A running reply is never cancelled by
    # another; one that times out or is cancelled by hand hands over below
    concurrency:
      group: agentkit-reply-${{ github.event.issue.number || github.event.client_payload.issue }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number || github.event.client_payload.issue }}
      AGENTKIT_INTERFACE: ${{ vars.AGENTKIT_INTERFACE }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write
          permission-pull-requests: write
          permission-contents: write  # merging an approved research PR and deleting its branch
          permission-actions: read  # Load agentkit reads this run's referenced workflows

      # only the Slack bot's own App may send a Slack event: anyone with write access can send a repository_dispatch, and
      # its payload could name someone else. AGENTKIT_SLACK_BOT_APP is the bot's App slug when it has an App of its own
      - id: sender
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          BOT: ${{ vars.AGENTKIT_SLACK_BOT_APP || steps.app.outputs.app-slug }}[bot]
        run: |
          [ "$SENDER" = "$BOT" ] || { echo "::error::refusing a Slack event sent by $SENDER, not by the Slack bot ($BOT); set AGENTKIT_SLACK_BOT_APP if the bot has its own GitHub App"; exit 1; }

      # the kit's scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: reply.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      # prompt-injection guard: only answers from people with write access drive the task
      - id: trust
        continue-on-error: true  # an untrusted commenter is ignored, not an error
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ github.event.comment.user.login || github.event.client_payload.login }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]
          require-all: "true"

      - name: Apply the reply
        if: steps.trust.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOGIN: ${{ github.event.comment.user.login || github.event.client_payload.login }}
          AGENTKIT_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          AGENTKIT_MERGE_METHOD: ${{ vars.AGENTKIT_MERGE_METHOD }}
          AGENTKIT_DELETE_BRANCH: ${{ vars.AGENTKIT_DELETE_BRANCH }}
          AGENTKIT_APP_KEY: ${{ secrets.AGENTKIT_APP_KEY }}  # signs the Slack reply record
        run: |
          # defense in depth: the kit never answers itself (its own stuck messages and pings land on waiting issues);
          # login and type come from the event file, not an expression
          [[ $N =~ ^[1-9][0-9]*$ ]] || { echo "::error::not an issue number"; exit 1; }
          author=$(jq -r '"\(.comment.user.login // .client_payload.login // "") \(.comment.user.type // "")"' "$GITHUB_EVENT_PATH")
          if [ "${author% *}" = "$AGENTKIT_BOT" ] || [ "${author##* }" = Bot ]; then echo "#$N: a bot's comment; nothing to do"; exit 0; fi
          # the comment body is read from the event file with jq, never through an expression or one env value
          # (one argument or env value is capped at 128 KiB on Linux; apply-reply.sh takes the text as an argument).
          # Bytes, not characters: a Hebrew letter takes 2 bytes, an emoji 4, so the message names bytes
          size=$(jq -j '.comment.body // .client_payload.text // ""' "$GITHUB_EVENT_PATH" | wc -c)
          if [ "$size" -gt 100000 ]; then
            gh issue comment "$N" --repo "$REPO" --body "agentkit: that reply is too long (over 100000 bytes, about 50000 letters in Hebrew or 100000 in English); shorten it and answer again."
            exit 0
          fi
          # the issue as it is now, not as the event saw it: an earlier reply may have moved it on.
          # Captured first so an API error fails the step (fail closed; the next step hands over)
          issue=$(gh issue view "$N" --repo "$REPO" --json state,labels)
          [ "$(jq -r .state <<<"$issue")" = OPEN ] || { echo "#$N is closed; nothing to do"; exit 0; }
          out=$(jq -c --argjson issue "$issue" '{body: (.comment.body // .client_payload.text // ""), labels: [$issue.labels[].name]}' "$GITHUB_EVENT_PATH" \
            | python3 .agentkit-kit/scripts/reply.py)
          action=$(jq -r .action <<<"$out")
          arg=$(jq -r .arg <<<"$out")
          KEYWORDS=$(jq -r '.keywords | join(" ")' <<<"$out")
          FREE_TEXT=$(jq -r .free_text <<<"$out")
          # the reply's own comment id: a rounds reset names it, so the gate counts it once and only for a person
          COMMENT_ID=$(jq -r '.comment.id // ""' "$GITHUB_EVENT_PATH")
          # from Slack the person's say is a signed record the kit writes (slackrec.py): people.sh and the gate count it
          # as that login's comment, and its id is the COMMENT_ID a retry or guidance names. Nothing to record for a
          # reply that does nothing
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] && [ "$action" != none ] && [ "$action" != hint ]; then
            COMMENT_ID=$(jq -j '.client_payload.text // ""' "$GITHUB_EVENT_PATH" \
              | python3 .agentkit-kit/scripts/slackrec.py sign "$REPO" "$N" "$LOGIN" \
              | gh api "repos/$REPO/issues/$N/comments" -F body=@- --jq .id)
          fi
          export KEYWORDS FREE_TEXT COMMENT_ID
          # the person's text is never echoed: a log line can carry workflow commands
          echo "#$N: $action"
          .agentkit-kit/scripts/apply-reply.sh "$REPO" "$N" "$action" "$arg" "$LOGIN"

      # without this a failed reply leaves the person waiting on an answer that never came
      - name: Hand over on failure
        # a refused sender is not a reply: nothing to hand over
        if: (failure() || cancelled()) && steps.sender.outcome != 'failure'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # the status first, then the comment: Slack threads a comment under the card only once action:required is there.
          # The kit may not have loaded if the run failed early
          if ! .agentkit-kit/scripts/set-status.sh "$REPO" "$N" status:needs-human reason:agent-error; then
            # by hand, still in one edit that leaves exactly one status and one reason
            old=$(gh issue view "$N" --repo "$REPO" --json labels \
              --jq '.labels[].name | select((startswith("status:") and . != "status:needs-human") or (startswith("reason:") and . != "reason:agent-error"))')
            args=()
            for l in $old; do args+=(--remove-label "$l"); done
            gh issue edit "$N" --repo "$REPO" ${args[@]+"${args[@]}"} --add-label status:needs-human --add-label reason:agent-error --add-label action:required
          fi
          printf '%s\n' "agentkit: could not apply your reply ($RUN). Needs a human." "" \
            "Answer with the Comment button on this issue's card in Slack." | gh issue comment "$N" --repo "$REPO" --body-file -

  # the Slack bot's `+ Add task`: a new issue, filed for a person with write access
  task:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'agentkit-slack-task'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    env:
      REPO: ${{ github.repository }}
    steps:
      # the payload is read from the event file with jq, never through an expression
      - id: payload
        name: Check the payload
        run: |
          login=$(jq -r '.client_payload.login // ""' "$GITHUB_EVENT_PATH")
          [[ $login =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::the payload names no GitHub login"; exit 1; }
          # the bot's limits again: a one-line title of at most 256 characters, a body of at most 3000
          jq -e '(.client_payload.title | type == "string" and test("\\S") and length <= 256 and (test("[\\r\\n]") | not))
                 and ((.client_payload.body // "") | type == "string" and length <= 3000)' "$GITHUB_EVENT_PATH" >/dev/null \
            || { echo "::error::the task's title or body is missing or too long"; exit 1; }
          echo "login=$login" >>"$GITHUB_OUTPUT"

      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write  # the new issue and its status
          permission-actions: read  # Load agentkit reads this run's referenced workflows

      # only the Slack bot's own App may send a Slack event: anyone with write access can send a repository_dispatch, and
      # its payload could name someone else. AGENTKIT_SLACK_BOT_APP is the bot's App slug when it has an App of its own
      - id: sender
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          BOT: ${{ vars.AGENTKIT_SLACK_BOT_APP || steps.app.outputs.app-slug }}[bot]
        run: |
          [ "$SENDER" = "$BOT" ] || { echo "::error::refusing a Slack event sent by $SENDER, not by the Slack bot ($BOT); set AGENTKIT_SLACK_BOT_APP if the bot has its own GitHub App"; exit 1; }

      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: reply.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      # the bot checked the person's write access; the workflow checks it again
      - id: trust
        continue-on-error: true  # an untrusted login is ignored, not an error
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ steps.payload.outputs.login }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]
          require-all: "true"

      - name: File the issue
        if: steps.trust.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOGIN: ${{ steps.payload.outputs.login }}
        run: |
          title=$(jq -r .client_payload.title "$GITHUB_EVENT_PATH")
          body=$(jq -r --arg login "$LOGIN" '(.client_payload.body // "" | sub("\\s+$"; "")) as $b
                   | (if $b == "" then "" else $b + "\n\n" end) + "Filed by @\($login) from Slack."' "$GITHUB_EVENT_PATH")
          # status:refining in the same call that creates it: what triage.yml gives a new issue by a trusted author, so
          # refine picks it up, and triage (which then finds a status) never sets it a second time
          url=$(printf '%s\n' "$body" | gh issue create --repo "$REPO" --title "$title" --body-file - --label status:refining)
          # the title is never echoed: a log line can carry workflow commands
          echo "filed $url for $LOGIN"

  # the Slack bot's settings question: the model only picks a registry entry and words the answer; settings.py keeps
  # only options that pass the registry's rule, and the card goes to the person's DM
  settings:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'agentkit-slack-settings'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions: {}
    env:
      REPO: ${{ github.repository }}
    steps:
      # the payload is read from the event file with jq, never through an expression
      - id: payload
        name: Check the payload
        run: |
          login=$(jq -r '.client_payload.login // ""' "$GITHUB_EVENT_PATH")
          user=$(jq -r '.client_payload.slack_user // ""' "$GITHUB_EVENT_PATH")
          [[ $login =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::the payload names no GitHub login"; exit 1; }
          [[ $user =~ ^[UW][A-Z0-9]+$ ]] || { echo "::error::the payload names no Slack user"; exit 1; }
          jq -e '.client_payload.question | type == "string" and test("\\S") and length <= 500' "$GITHUB_EVENT_PATH" >/dev/null \
            || { echo "::error::the question is missing or too long"; exit 1; }
          { echo "login=$login"; echo "user=$user"; } >>"$GITHUB_OUTPUT"

      # one token for the whole job: Load agentkit and the permission check; the model gets nothing it can write with
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-actions: read  # Load agentkit reads this run's referenced workflows

      # only the Slack bot's own App may send a Slack event: anyone with write access can send a repository_dispatch, and
      # its payload could name someone else. AGENTKIT_SLACK_BOT_APP is the bot's App slug when it has an App of its own
      - id: sender
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          BOT: ${{ vars.AGENTKIT_SLACK_BOT_APP || steps.app.outputs.app-slug }}[bot]
        run: |
          [ "$SENDER" = "$BOT" ] || { echo "::error::refusing a Slack event sent by $SENDER, not by the Slack bot ($BOT); set AGENTKIT_SLACK_BOT_APP if the bot has its own GitHub App"; exit 1; }

      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: reply.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      # the bot checked the person's write access; the workflow checks it again
      - id: trust
        continue-on-error: true  # an untrusted login is ignored, not an error
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ steps.payload.outputs.login }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]
          require-all: "true"

      - id: prompt
        if: steps.trust.outcome == 'success'
        run: |
          # a random delimiter, so the question cannot end the output early
          eof=EOF$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
          { echo "text<<$eof"
            jq -r .client_payload.question "$GITHUB_EVENT_PATH" | python3 .agentkit-kit/scripts/settings.py prompt
            echo "$eof"; } >>"$GITHUB_OUTPUT"

      # the question and the registry only: no checkout, no tools, one turn, a token that can only read Actions.
      # `--tools=` (empty, joined): the action drops a separate "" and the CLI then refuses to start
      - id: claude
        if: steps.trust.outcome == 'success'
        continue-on-error: true  # no answer is DMed as such below
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          # the bot's own App sends the dispatch; the trust step vetted the person
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.AGENTKIT_SETTINGS_MODEL || inputs.model }}
            --max-turns 1
            --tools=

      - name: Usage
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true  # usage logging never fails a run
        uses: ./.agentkit-kit/.github/actions/usage
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          job: settings
          model: ${{ vars.AGENTKIT_SETTINGS_MODEL || inputs.model }}

      - name: Answer in Slack
        if: steps.trust.outcome == 'success'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          USER_ID: ${{ steps.payload.outputs.user }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOGIN: ${{ steps.payload.outputs.login }}
        run: |
          result=''
          [ -z "$EXEC" ] || result=$(jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXEC" 2>/dev/null || true)
          if [ -z "$result" ]; then
            jq -n --arg t "Sorry, I could not look that up this time ($RUN). Ask again in a bit." '{text: $t}'
          else
            jq --arg result "$result" '{question: .client_payload.question, result: $result}' "$GITHUB_EVENT_PATH" \
              | python3 .agentkit-kit/scripts/settings.py card "$REPO"
          fi | python3 .agentkit-kit/scripts/settings.py dm "$USER_ID" >/dev/null
          # the question and the answer are never echoed: a log line can carry workflow commands
          echo "answered a settings question for $LOGIN"

  # a project setting picked on a settings card: admin only, validated again, then a repo variable or a caller PR
  setting:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'agentkit-slack-setting'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: agentkit-setting
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
    steps:
      # the payload is read from the event file with jq, never through an expression; the value never leaves it
      - id: payload
        name: Check the payload
        run: |
          login=$(jq -r '.client_payload.login // ""' "$GITHUB_EVENT_PATH")
          user=$(jq -r '.client_payload.slack_user // ""' "$GITHUB_EVENT_PATH")
          key=$(jq -r '.client_payload.key // ""' "$GITHUB_EVENT_PATH")
          [[ $login =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::the payload names no GitHub login"; exit 1; }
          [[ $user =~ ^[UW][A-Z0-9]+$ ]] || { echo "::error::the payload names no Slack user"; exit 1; }
          [[ $key =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::the payload names no setting"; exit 1; }
          jq -e '.client_payload.value | type == "string" and length <= 1000 and (test("[\\r\\n]") | not)' "$GITHUB_EVENT_PATH" >/dev/null \
            || { echo "::error::the value is missing, too long or more than one line"; exit 1; }
          { echo "login=$login"; echo "user=$user"; echo "key=$key"; } >>"$GITHUB_OUTPUT"

      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-actions: read  # Load agentkit reads this run's referenced workflows

      # only the Slack bot's own App may send a Slack event: anyone with write access can send a repository_dispatch, and
      # its payload could name someone else. AGENTKIT_SLACK_BOT_APP is the bot's App slug when it has an App of its own
      - id: sender
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          BOT: ${{ vars.AGENTKIT_SLACK_BOT_APP || steps.app.outputs.app-slug }}[bot]
        run: |
          [ "$SENDER" = "$BOT" ] || { echo "::error::refusing a Slack event sent by $SENDER, not by the Slack bot ($BOT); set AGENTKIT_SLACK_BOT_APP if the bot has its own GitHub App"; exit 1; }

      - name: Load agentkit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: reply.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD

      # the bot checked admin access; the workflow checks it, and the value, again
      - id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LOGIN: ${{ steps.payload.outputs.login }}
          KEY: ${{ steps.payload.outputs.key }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          USER_ID: ${{ steps.payload.outputs.user }}
        run: |
          dm() { jq -n --arg t "$1" '{text: $t}' | python3 .agentkit-kit/scripts/settings.py dm "$USER_ID" >/dev/null; }
          value=$(jq -r .client_payload.value "$GITHUB_EVENT_PATH")
          perm=$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq .permission 2>/dev/null || echo none)
          via=$(jq -r --arg k "$KEY" '.[] | select(.key == $k) | "\(.apply.via) \(.apply.name // "")"' .agentkit-kit/config/settings.json)
          if [ "$perm" != admin ]; then
            dm "Not changed: $LOGIN needs admin access to $REPO to change its settings."; via=none
          elif ! why=$(python3 .agentkit-kit/scripts/settings.py validate "$KEY" "$value"); then
            dm "Not changed: $why."; via=none
          elif [ "${via% *}" != variable ] && [ "${via% *}" != caller ]; then
            dm "Not changed: that one is not set through GitHub (/agentkit:settings in Claude Code says how)."; via=none
          fi
          { echo "via=${via% *}"; echo "name=${via#* }"; } >>"$GITHUB_OUTPUT"
          echo "$KEY for $LOGIN: ${via% *}"

      - id: variables
        if: steps.check.outputs.via == 'variable'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-actions-variables: write  # the App's "Variables" repository permission

      - name: Set the repo variable
        if: steps.check.outputs.via == 'variable'
        env:
          GH_TOKEN: ${{ steps.variables.outputs.token }}
          NAME: ${{ steps.check.outputs.name }}
          KEY: ${{ steps.payload.outputs.key }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          USER_ID: ${{ steps.payload.outputs.user }}
        run: |
          value=$(jq -r .client_payload.value "$GITHUB_EVENT_PATH")
          old=()
          if was=$(gh variable get "$NAME" --repo "$REPO" 2>/dev/null); then old=("$was"); fi
          if [ -n "$value" ]; then gh variable set "$NAME" --repo "$REPO" --body "$value"
          else gh variable delete "$NAME" --repo "$REPO" 2>/dev/null || true; fi
          python3 .agentkit-kit/scripts/settings.py changed "$REPO" "$KEY" "$value" ${old[@]+"${old[@]}"} \
            | python3 .agentkit-kit/scripts/settings.py dm "$USER_ID" >/dev/null
          echo "set $NAME"

      - id: caller
        if: steps.check.outputs.via == 'caller'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-contents: write  # the branch and its commit
          permission-pull-requests: write
          permission-workflows: write  # the commit changes .github/workflows/agentkit.yml

      # merging stays the owner's call
      - name: Open a pull request on the caller
        if: steps.check.outputs.via == 'caller'
        env:
          GH_TOKEN: ${{ steps.caller.outputs.token }}
          LOGIN: ${{ steps.payload.outputs.login }}
          KEY: ${{ steps.payload.outputs.key }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          USER_ID: ${{ steps.payload.outputs.user }}
          CALLER: .github/workflows/agentkit.yml
        run: |
          dm() { jq -n --arg t "$1" '{text: $t}' | python3 .agentkit-kit/scripts/settings.py dm "$USER_ID" >/dev/null; }
          value=$(jq -r .client_payload.value "$GITHUB_EVENT_PATH")
          base=$(gh api "repos/$REPO" --jq .default_branch)
          meta=$(gh api "repos/$REPO/contents/$CALLER?ref=$base")
          jq -r .content <<<"$meta" | base64 -d >caller.yml
          cp caller.yml caller.old
          if ! why=$(python3 .agentkit-kit/scripts/settings.py caller "$KEY" "$value" caller.yml); then
            dm "Not changed: $why."; exit 0
          fi
          if cmp -s caller.yml caller.old; then dm "$KEY is already $value in $REPO's caller workflow."; exit 0; fi
          branch="agentkit/setting-$KEY-$GITHUB_RUN_ID" title="agentkit: set $KEY to ${value:0:120}"
          head=$(gh api "repos/$REPO/git/ref/heads/$base" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$head" >/dev/null
          gh api -X PUT "repos/$REPO/contents/$CALLER" -f branch="$branch" -f sha="$(jq -r .sha <<<"$meta")" \
            -f message="$title" -f content="$(base64 -w0 caller.yml)" >/dev/null
          url=$(printf '%s\n' "Sets \`$KEY\` in the caller workflow, asked for by @$LOGIN from Slack (a settings card)." "" \
                  "Merging applies it; closing this PR leaves things as they are." \
            | gh pr create --repo "$REPO" --base "$base" --head "$branch" --title "$title" --body-file -)
          dm "Pull request to set $KEY to $value in $REPO: $url. Merging it applies the change; closing it leaves things as they are."
          echo "opened $url for $LOGIN"
