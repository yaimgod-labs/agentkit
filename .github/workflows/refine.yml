# Refiner: runs on status:refining, and again when a person answers on a
# status:needs-info issue. Claude (read-only) triages and plans the issue; this
# workflow posts the plan and questions, sets size/type/mode labels, and moves the
# issue to status:ready (small and clear) or status:needs-info (assigned to you).
name: agentkit-refine

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts and the plugin from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
      model:
        description: Claude model for every agent in this workflow
        type: string
        default: claude-opus-5-5
      plugins:
        description: Extra plugins (newline list of NAME@MARKETPLACE — `agentkit` for the kit's pinned externals, or the name in this repo's .claude-plugin/marketplace.json)
        type: string
        default: ""
      max-turns:
        type: number
        default: 40
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  # a needs-info issue with an open agent PR waits on a review of that PR (implement asked the reviewer there), not
  # on a new plan: a re-plan would move it to ready and start a new round outside the review. Point the commenter
  # to the PR instead. Fails open: an API error refines as before.
  check:
    if: github.event_name == 'issue_comment'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: write
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write
          permission-pull-requests: read

      - id: pr
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          pr=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/" + env.N + "-")) | .number' | sed -n 1p) || pr=
          [ -n "$pr" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "agentkit: this issue's PR #$pr is open. To answer its question, submit a \"Request changes\" review on #$pr with the details."
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  refine:
    needs: check
    # check is skipped for a label event, and refine still runs
    if: ${{ !cancelled() && needs.check.outputs.pr == '' }}
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read  # checkout of a private repo
    concurrency:
      group: agentkit-issue-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      AGENTKIT_INTERFACE: ${{ vars.AGENTKIT_INTERFACE }}
    steps:
      - id: write
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write
          permission-actions: read

      # what Claude gets: read the repo, issues and PRs; no writes at all
      - id: read
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: refine.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD
          if [ -d .git ]; then echo .agentkit-kit/ >>.git/info/exclude; fi
          # a project marketplace (.claude-plugin/marketplace.json) adds the project's own pinned plugins
          if [ -f .claude-plugin/marketplace.json ]; then echo "project-marketplace=$GITHUB_WORKSPACE" >>"$GITHUB_OUTPUT"; fi

      # both the issue's author and whoever started this run (labelled it, or answered) need write access
      - uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ github.event.issue.user.login }} ${{ github.event.sender.login }}
          token: ${{ steps.write.outputs.token }}
          bot: ${{ steps.write.outputs.app-slug }}[bot]
          require-all: "true"

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.read.outputs.token }}
          plugin_marketplaces: |
            ${{ github.workspace }}/.agentkit-kit
            ${{ steps.kit.outputs.project-marketplace }}
          plugins: |
            agentkit@agentkit
            ${{ inputs.plugins }}
          prompt: |
            Repository ${{ github.repository }}, issue #${{ github.event.issue.number }}.
            Use the agentkit:refine-issue skill on this issue. Do not edit files; your token is read-only.
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools Bash(gh:*),Bash(rg:*),Bash(git log:*),Read,Glob,Grep,Skill

      - name: Usage
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true  # usage logging never fails a run
        uses: ./.agentkit-kit/.github/actions/usage
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          job: refine
          model: ${{ inputs.model }}

      - name: Apply verdict
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          BOT: ${{ steps.write.outputs.app-slug }}[bot]
        run: |
          result=$(jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXEC")
          verdict=$(sed -n 's/^VERDICT: //p' <<<"$result" | tail -1)
          # trust nothing in the verdict beyond these values
          if ! jq -e '(.status|IN("ready","needs-info")) and (.size|IN("xs","s","m","l"))
                      and (.type|IN("feature","bug","chore","debt","research","rfc")) and (.mode|IN("agent","human","pair"))
                      and ((has("blocked_by")|not) or (.blocked_by|type=="array" and all(.[]; type=="number" and .==floor and .>0)))' <<<"$verdict" >/dev/null 2>&1; then
            echo "::error::no valid VERDICT line in the refiner's answer: ${verdict:-none}"
            exit 1
          fi
          gh issue comment "$N" --repo "$REPO" --body "$(grep -v '^VERDICT: ' <<<"$result")"
          new=$(jq -r '"size:\(.size) type:\(.type) mode:\(.mode)"' <<<"$verdict")
          args=()
          while IFS= read -r l; do
            case " $new " in *" $l "*) ;; *) args+=(--remove-label "$l") ;; esac
          done < <(gh issue view "$N" --repo "$REPO" --json labels \
                   --jq '.labels[].name | select(test("^(size|mode):") or IN("type:feature","type:bug","type:chore","type:debt","type:research","type:rfc"))')
          for l in $new; do args+=(--add-label "$l"); done
          gh issue edit "$N" --repo "$REPO" "${args[@]}" >/dev/null
          # record the dependencies before the status moves, so the issue never reaches ready ahead of its blockers.
          # A blocker a person removed with `/board unlink` (its `<!-- agentkit:unlinked #b -->` comment, by the
          # owner, a member or a collaborator) is never added back. One that fails (closed, missing, already linked)
          # is a warning and one comment on the issue, not a failed run.
          unlinked=$(gh api --paginate "repos/$REPO/issues/$N/comments" \
            --jq '.[] | select(.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) | .body | scan("<!-- agentkit:unlinked #([0-9]+) -->") | .[0]') \
            || { echo "::warning::could not read #$N's comments for unlinked blockers"; unlinked=; }
          failed=
          while IFS= read -r b; do
            if grep -qx "$b" <<<"$unlinked"; then echo "#$b was unlinked by a person; not recorded"; continue; fi
            if ! err=$( { id=$(gh api "repos/$REPO/issues/$b" --jq .id) \
                          && gh api "repos/$REPO/issues/$N/dependencies/blocked_by" -F issue_id="$id" >/dev/null; } 2>&1 ); then
              reason=$(tr '\n' ' ' <<<"$err" | cut -c1-300 | sed 's/ *$//')
              echo "::warning::could not record #$b as a blocker of #$N: $reason"
              failed+="agentkit: could not record #$b as a blocker: $reason"$'\n'
            fi
          done < <(jq -r --argjson n "$N" '(.blocked_by // []) | unique | .[] | select(. != $n)' <<<"$verdict")
          if [ -n "$failed" ]; then gh issue comment "$N" --repo "$REPO" --body "$failed" >/dev/null || true; fi
          status=$(jq -r .status <<<"$verdict")
          .agentkit-kit/scripts/set-status.sh "$REPO" "$N" "status:$status"
          if [ "$status" = needs-info ] && [ "$SENDER" != "$BOT" ]; then
            gh issue edit "$N" --repo "$REPO" --add-assignee "$SENDER" >/dev/null || true  # assignee must be a collaborator
          fi

      - name: Hand over on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$N" --repo "$REPO" --body "agentkit: refine run failed or timed out ($RUN). Needs a human."
          .agentkit-kit/scripts/set-status.sh "$REPO" "$N" status:needs-human reason:agent-error \
            || gh issue edit "$N" --repo "$REPO" --add-label status:needs-human --add-label reason:agent-error
