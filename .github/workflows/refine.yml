# Refiner: runs on status:refining, and again when a person answers on a
# status:needs-info issue. Claude (read-only) triages and plans the issue; this
# workflow posts the plan and questions, sets size/type/mode labels, and moves the
# issue to status:ready (small and clear) or status:needs-info (assigned to you).
# In the Slack mode a large task (size m or l, not research or an RFC) proposes its split for
# approval (status:needs-approval), or with repo var AUTO_SPLIT=true comments /plan to split at once.
name: agentkit-refine

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts and the plugin from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
      model:
        description: Claude model for every agent in this workflow
        type: string
        default: claude-opus-5-5
      plugins:
        description: Extra plugins (newline list of NAME@MARKETPLACE — `agentkit` for the kit's pinned externals, or the name in this repo's .claude-plugin/marketplace.json)
        type: string
        default: ""
      max-turns:
        type: number
        default: 40
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  # a needs-info issue with an open agent PR waits on a review of that PR (implement asked the reviewer there), not
  # on a new plan: a re-plan would move it to ready and start a new round outside the review. Point the commenter
  # to the PR instead. Fails open: an API error refines as before.
  check:
    if: github.event_name == 'issue_comment'
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: write
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write
          permission-pull-requests: read

      - id: pr
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          pr=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/" + env.N + "-")) | .number' | sed -n 1p) || pr=
          [ -n "$pr" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "agentkit: this issue's PR #$pr is open. To answer its question, submit a \"Request changes\" review on #$pr with the details."
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  refine:
    needs: check
    # check is skipped for a label event, and refine still runs
    if: ${{ !cancelled() && needs.check.outputs.pr == '' }}
    runs-on: ${{ github.event.repository.private && vars.AGENTKIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(vars.AGENTKIT_REFINE_TIMEOUT || '20') }}
    permissions:
      contents: read  # checkout of a private repo
    concurrency:
      group: agentkit-issue-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      AGENTKIT_INTERFACE: ${{ vars.AGENTKIT_INTERFACE == 'claude-slack' && 'slack' || vars.AGENTKIT_INTERFACE }}  # claude-slack: the value's older name
    steps:
      - id: write
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-issues: write
          permission-actions: read

      # what Claude gets: read the repo, issues and PRs; no writes at all
      - id: read
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: refine.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD
          if [ -d .git ]; then echo .agentkit-kit/ >>.git/info/exclude; fi
          # a project marketplace (.claude-plugin/marketplace.json) adds the project's own pinned plugins
          if [ -f .claude-plugin/marketplace.json ]; then echo "project-marketplace=$GITHUB_WORKSPACE" >>"$GITHUB_OUTPUT"; fi

      # both the issue's author and whoever started this run (labelled it, or answered) need write access
      - uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ github.event.issue.user.login }} ${{ github.event.sender.login }}
          token: ${{ steps.write.outputs.token }}
          bot: ${{ steps.write.outputs.app-slug }}[bot]
          require-all: "true"

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.read.outputs.token }}
          # the kit's bot starts this run in Slack mode (triage, replies, a relayed /plan); the trust step vets the people
          allowed_bots: ${{ steps.write.outputs.app-slug }}
          plugin_marketplaces: |
            ${{ github.workspace }}/.agentkit-kit
            ${{ steps.kit.outputs.project-marketplace }}
          plugins: |
            agentkit@agentkit
            ${{ inputs.plugins }}
          prompt: |
            Repository ${{ github.repository }}, issue #${{ github.event.issue.number }}.
            Use the agentkit:refine-issue skill on this issue. Do not edit files; your token is read-only.
          claude_args: >-
            --model ${{ vars.AGENTKIT_REFINE_MODEL || inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools Bash(gh:*),Bash(rg:*),Bash(git log:*),Read,Glob,Grep,Skill

      - name: Usage
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true  # usage logging never fails a run
        uses: ./.agentkit-kit/.github/actions/usage
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          job: refine
          model: ${{ vars.AGENTKIT_REFINE_MODEL || inputs.model }}

      - name: Apply verdict
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          BOT: ${{ steps.write.outputs.app-slug }}[bot]
          AUTO_SPLIT: ${{ vars.AUTO_SPLIT }}
        run: |
          result=$(jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXEC")
          verdict=$(sed -n 's/^VERDICT: //p' <<<"$result" | tail -1)
          # trust nothing in the verdict beyond these values
          if ! jq -e '(.status|IN("ready","needs-info")) and (.size|IN("xs","s","m","l"))
                      and (.type|IN("feature","bug","chore","debt","research","rfc")) and (.mode|IN("agent","human","pair"))
                      and ((has("blocked_by")|not) or (.blocked_by|type=="array" and all(.[]; type=="number" and .==floor and .>0)))' <<<"$verdict" >/dev/null 2>&1; then
            echo "::error::no valid VERDICT line in the refiner's answer: ${verdict:-none}"
            exit 1
          fi
          status=$(jq -r .status <<<"$verdict")
          # Slack mode: the verdict's optional research key (1-3 questions; ask.py validates it and warns
          # on a bad one) files each question as a research issue, and the issue waits on them (status:blocked)
          # instead of taking the verdict's status. Outside the mode the key is ignored.
          research='' asks=''
          if [ "$AGENTKIT_INTERFACE" = slack ]; then research=$(python3 .agentkit-kit/scripts/ask.py research <<<"$verdict"); fi
          # research stays one level deep: on an issue that is research already (by its labels, body marker or this
          # verdict), the questions go to a person as stuck messages and the issue waits for the answer (needs-info)
          if [ -n "$research" ]; then
            issue=$(gh issue view "$N" --repo "$REPO" --json labels,body)
            if [ "$(python3 .agentkit-kit/scripts/ask.py nested <<<"$issue")" != false ] || jq -e '.type == "research"' <<<"$verdict" >/dev/null; then
              asks=$research research='' status=needs-info
            fi
          fi
          body=$(grep -v '^VERDICT: ' <<<"$result" || true)
          # in the mode a large plain task (size m or l, not research or an RFC: split.py eligible) is split: at once
          # with AUTO_SPLIT=true (a /plan comment), otherwise once the person approves the split the verdict proposes
          # (status:needs-approval). Research and questions for a person come first. A missing or invalid split list
          # (split.py warns) leaves today's needs-info.
          split='' proposal=''
          if [ "$AGENTKIT_INTERFACE" = slack ] && [ -z "$research" ] && [ -z "$asks" ] \
             && [ "$(python3 .agentkit-kit/scripts/split.py eligible <<<"$verdict")" = true ]; then
            if [ "$AUTO_SPLIT" = true ]; then
              split=auto
            else
              qflag=()
              if grep -q '^## Questions' <<<"$body"; then qflag=(--questions); fi
              proposal=$(python3 .agentkit-kit/scripts/split.py proposal "${qflag[@]}" <<<"$verdict")
              if [ -n "$proposal" ]; then split=propose; fi
            fi
          fi
          [ "$split" != propose ] || status=needs-approval
          # in the mode a comment that leaves the issue waiting on a person (action:required) ends with the reply line
          # of its status and how to answer (a split proposal and each ask are their own comments, with their own
          # closing lines)
          human=false
          if jq -e '.status == "ready" and .mode == "human"' <<<"$verdict" >/dev/null; then human=true; fi
          if [ "$AGENTKIT_INTERFACE" = slack ] && [ -z "$research" ] && [ -z "$split" ] && [ -z "$asks" ]; then
            reply=
            if [ "$status" = needs-info ]; then reply="Reply with an answer, \`research <what to find out>\`, \`block <reason>\`, or \`close <why>\`."
            elif [ "$human" = true ]; then reply="Reply \`done\` once you have finished it, or \`block <reason>\`."; fi
            [ -z "$reply" ] || body+=$'\n\n'"$reply"$'\n'"Answer with the Comment button on this issue's card in Slack."
          fi
          # a status that waits on a person (in the mode) is set before its comments, as Slack threads a comment under
          # the issue's card only once action:required is there. Any other status keeps the plan first, so an issue
          # never reaches ready (and the implementer) ahead of its plan
          waiting=
          if [ "$AGENTKIT_INTERFACE" = slack ] && [ -z "$research" ] && [ "$split" != auto ]; then
            case "$status" in needs-info | needs-approval) waiting=1 ;; ready) [ "$human" = false ] || waiting=1 ;; esac
          fi
          if [ -z "$waiting" ]; then printf '%s\n' "$body" | gh issue comment "$N" --repo "$REPO" --body-file - >/dev/null; fi
          new=$(jq -r '"size:\(.size) type:\(.type) mode:\(.mode)"' <<<"$verdict")
          args=()
          while IFS= read -r l; do
            case " $new " in *" $l "*) ;; *) args+=(--remove-label "$l") ;; esac
          done < <(gh issue view "$N" --repo "$REPO" --json labels \
                   --jq '.labels[].name | select(test("^(size|mode):") or IN("type:feature","type:bug","type:chore","type:debt","type:research","type:rfc"))')
          for l in $new; do args+=(--add-label "$l"); done
          gh issue edit "$N" --repo "$REPO" "${args[@]}" >/dev/null
          # record the dependencies before the status moves, so the issue never reaches ready ahead of its blockers.
          # A blocker a person removed with `/board unlink` (its `<!-- agentkit:unlinked #b -->` comment, by the
          # owner, a member or a collaborator) is never added back. One that fails (closed, missing, already linked)
          # is a warning and one comment on the issue, not a failed run.
          unlinked=$(gh api --paginate "repos/$REPO/issues/$N/comments" \
            --jq '.[] | select(.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) | .body | scan("<!-- agentkit:unlinked #([0-9]+) -->") | .[0]') \
            || { echo "::warning::could not read #$N's comments for unlinked blockers"; unlinked=; }
          failed=
          while IFS= read -r b; do
            if grep -qx "$b" <<<"$unlinked"; then echo "#$b was unlinked by a person; not recorded"; continue; fi
            if ! err=$( { id=$(gh api "repos/$REPO/issues/$b" --jq .id) \
                          && gh api "repos/$REPO/issues/$N/dependencies/blocked_by" -F issue_id="$id" >/dev/null; } 2>&1 ); then
              reason=$(tr '\n' ' ' <<<"$err" | cut -c1-300 | sed 's/ *$//')
              echo "::warning::could not record #$b as a blocker of #$N: $reason"
              failed+="agentkit: could not record #$b as a blocker: $reason"$'\n'
            fi
          done < <(jq -r --argjson n "$N" '(.blocked_by // []) | unique | .[] | select(. != $n)' <<<"$verdict")
          if [ -n "$failed" ]; then gh issue comment "$N" --repo "$REPO" --body "$failed" >/dev/null || true; fi
          if [ -n "$research" ]; then
            # the kit asks, so the bot is the asker; apply-reply.sh links each issue as a blocker and sets status:blocked
            while IFS= read -r q; do
              AGENTKIT_BOT=$BOT .agentkit-kit/scripts/apply-reply.sh "$REPO" "$N" research "$q" "$BOT" </dev/null
            done <<<"$research"
            exit 0
          fi
          # the bot's /plan runs the planner, which turns this issue into an epic (plan.yml clears its status)
          if [ "$split" = auto ]; then
            gh issue comment "$N" --repo "$REPO" --body "/plan" >/dev/null
            exit 0
          fi
          .agentkit-kit/scripts/set-status.sh "$REPO" "$N" "status:$status"
          if [ -n "$waiting" ]; then
            printf '%s\n' "$body" | gh issue comment "$N" --repo "$REPO" --body-file - >/dev/null
            if [ -n "$asks" ]; then
              while IFS= read -r q; do
                msg=$(jq -nc --arg q "$q" '{kind: "question", text: $q,
                  why: "This issue is research already, so the kit asks a person instead of filing more research.",
                  checked: "The plan above."}' | python3 .agentkit-kit/scripts/ask.py message)
                printf '%s\n' "$msg" | gh issue comment "$N" --repo "$REPO" --body-file - >/dev/null
              done <<<"$asks"
            fi
            if [ "$split" = propose ]; then printf '%s\n' "$proposal" | gh issue comment "$N" --repo "$REPO" --body-file - >/dev/null; fi
          fi
          if [ "$status" = needs-info ] && [ "$SENDER" != "$BOT" ]; then
            gh issue edit "$N" --repo "$REPO" --add-assignee "$SENDER" >/dev/null || true  # assignee must be a collaborator
          fi

      - name: Hand over on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # the status first, then the comment: Slack threads a comment under the issue's card only once
          # action:required is there. In the Slack mode the comment ends with the Comment-button line
          if ! .agentkit-kit/scripts/set-status.sh "$REPO" "$N" status:needs-human reason:agent-error; then
            # the kit may not have loaded if the run failed early: by hand. In the mode also one status, one reason
            # and action:required, so the card and the reply job see the handover
            args=()
            if [ "$AGENTKIT_INTERFACE" = slack ]; then
              for l in $(gh issue view "$N" --repo "$REPO" --json labels --jq '.labels[].name | select((startswith("status:") and . != "status:needs-human") or (startswith("reason:") and . != "reason:agent-error"))'); do
                args+=(--remove-label "$l")
              done
              args+=(--add-label action:required)
            fi
            gh issue edit "$N" --repo "$REPO" ${args[@]+"${args[@]}"} --add-label status:needs-human --add-label reason:agent-error
          fi
          msg="agentkit: refine run failed or timed out ($RUN). Needs you."
          [ "$AGENTKIT_INTERFACE" != slack ] || msg+=$'\n\n'"Reply \`retry\`, or say what to change."$'\n'"Answer with the Comment button on this issue's card in Slack."
          printf '%s\n' "$msg" | gh issue comment "$N" --repo "$REPO" --body-file -
