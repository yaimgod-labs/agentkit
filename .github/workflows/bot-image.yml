# Builds the Slack bot image (bot/Dockerfile) on a GitHub-hosted runner and scans it with Trivy: a fixable HIGH or
# CRITICAL finding fails the run. On main it pushes the image to GHCR and attests its digest, so a server can pull
# `ghcr.io/<owner>/<repo>-bot@sha256:…` and verify it with `gh attestation verify`. Not a reusable workflow: it
# runs in the kit repo only, so it is exempt from the caller-permissions rule in tests/test_permissions.py.
name: bot-image

on:
  pull_request:
    paths: ["bot/**", "scripts/card.py", "scripts/reply.py", "scripts/settings.py", "config/settings.json", "plugins/agentkit/scripts/board.py", ".github/workflows/bot-image.yml"]
  push:
    branches: [main]
    paths: ["bot/**", "scripts/card.py", "scripts/reply.py", "scripts/settings.py", "config/settings.json", "plugins/agentkit/scripts/board.py", ".github/workflows/bot-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-bot" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .  # the kit's root: the image takes card.py, reply.py, settings.py, board.py and the registry (bot/Dockerfile.dockerignore)
          file: bot/Dockerfile
          load: true
          tags: scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (fixable HIGH and CRITICAL fail the run)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .  # the kit's root: the image takes card.py, reply.py, settings.py, board.py and the registry (bot/Dockerfile.dockerignore)
          file: bot/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha

      - if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
