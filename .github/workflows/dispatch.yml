# Dispatcher: promotes the top unblocked status:ready issue (board Rank first, then board.py's order; not mode:human, not size:m/l; one debt-label issue in every debt-every)
# to status:in-progress while fewer than WIP issues are in flight; mirrors status
# labels onto the board; closes the linked issue when an agent PR merges into a
# non-default branch; approves a PR once its Human verification boxes are ticked;
# on a `/decide accept|reject <why>` PR comment sends the RFC back to the implementer to record it;
# on a person's "Request changes" review sends the PR back to the implementer.
name: agentkit-dispatch

on:
  workflow_call:
    inputs:
      agentkit-ref:
        description: Override the kit commit, branch or tag to load scripts and the plugin from (default — the commit the caller's `uses:` resolved to)
        type: string
        default: ""
      wip:
        description: Max agent issues not merged yet (in-progress through approved)
        type: number
        default: 2
      debt-every:
        description: Take one debt-label issue in every N issues (0 = debt is ranked like any other issue)
        type: number
        default: 4
      debt-label:
        description: The label that marks tech debt for debt-every
        type: string
        default: type:debt
    secrets:
      AGENTKIT_APP_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # one dispatcher run at a time per repo; queued runs are not cancelled
    concurrency:
      group: agentkit-dispatch-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTKIT_CLIENT_ID }}
          private-key: ${{ secrets.AGENTKIT_APP_KEY }}

      # the kit's plugin, scripts and actions, from the repo and commit this workflow itself was loaded from
      # (the caller's `uses:`), so no owner or ref is written down anywhere in the kit
      - name: Load agentkit
        id: kit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELF: dispatch.yml
          REF: ${{ inputs.agentkit-ref }}
        run: |
          read -r kit sha < <(gh api "$RUN" --jq '[.referenced_workflows[] | select(.path | contains("/.github/workflows/" + env.SELF + "@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"') || true
          [ -n "${kit:-}" ] || { echo "::error::$SELF is not among this run's referenced workflows"; exit 1; }
          # ponytail: anonymous fetch, so the kit repo must be public; add token auth for a private fork
          git init -q .agentkit-kit
          git -C .agentkit-kit fetch -q --depth 1 "https://github.com/$kit.git" "${REF:-$sha}"
          git -C .agentkit-kit checkout -q FETCH_HEAD
          if [ -d .git ]; then echo .agentkit-kit/ >>.git/info/exclude; fi
          # a project marketplace (.claude-plugin/marketplace.json) adds the project's own pinned plugins
          if [ -f .claude-plugin/marketplace.json ]; then echo "project-marketplace=$GITHUB_WORKSPACE" >>"$GITHUB_OUTPUT"; fi

      - name: Sync board status
        continue-on-error: true  # a board problem must never stop dispatching
        if: github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'status:') && vars.AGENTKIT_PROJECT != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          LABEL: ${{ github.event.label.name }}
          OWNER: ${{ github.repository_owner }}
          PROJECT: ${{ vars.AGENTKIT_PROJECT }}
        run: |
          stage=$(case "$LABEL" in
            status:backlog) echo Backlog;; status:ready) echo Ready;; status:in-progress) echo "In progress";;
            status:review) echo Review;; status:changes-requested) echo "Changes requested";; status:approved) echo Approved;;
            status:blocked) echo Blocked;; status:needs-human) echo "Needs human";;
            status:refining) echo Refining;; status:needs-info) echo "Needs info";;
            status:needs-verification) echo "Needs verification";; esac)
          [ -n "$stage" ] || exit 0
          pid=$(gh project view "$PROJECT" --owner "$OWNER" --format json --jq .id)
          item=$(gh project item-add "$PROJECT" --owner "$OWNER" --url "$ISSUE_URL" --format json --jq .id)
          field=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json --jq '.fields[]|select(.name=="Stage")')
          fid=$(jq -r .id <<<"$field"); oid=$(jq -r --arg s "$stage" '.options[]|select(.name==$s).id' <<<"$field")
          [ -n "$oid" ] || { echo "::warning::board Stage field has no '$stage' option; add it in the project settings"; exit 0; }
          gh project item-edit --project-id "$pid" --id "$item" --field-id "$fid" --single-select-option-id "$oid"

      - name: Close issue of merged agent PR
        if: github.event_name == 'pull_request' && github.event.pull_request.merged
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          n=$(sed -nE 's#^agent/([0-9]+)-.*#\1#p' <<<"$HEAD")
          [ -n "$n" ] || exit 0
          gh issue close "$n" --repo "$REPO" --reason completed || true  # already closed when merged into the default branch
          .agentkit-kit/scripts/set-status.sh "$REPO" "$n" || true

      - name: Approve after human verification
        if: github.event_name == 'pull_request' && github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          n=$(sed -nE 's#^agent/([0-9]+)-.*#\1#p' <<<"$HEAD")
          [ -n "$n" ] || exit 0
          gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx status:needs-verification || exit 0
          read -r unmet human < <(printf '%s\n' "$BODY" | .agentkit-kit/scripts/checklist.sh)
          echo "#$n: $unmet unmet, $human human item(s) left"
          if [ "$unmet" -eq 0 ] && [ "$human" -eq 0 ]; then .agentkit-kit/scripts/set-status.sh "$REPO" "$n" status:approved; fi

      # /decide on an RFC PR: the implementer's fix round reads the PR comments, marks the RFC and writes the record
      - id: decider
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        continue-on-error: true  # an untrusted commenter is ignored, not an error
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ github.event.comment.user.login }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]
          require-all: "true"

      - name: Record a /decide
        if: steps.decider.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          grep -qiE '^/decide (accept|reject)\b' <<<"$BODY" || { gh pr comment "$PR" --repo "$REPO" --body "agentkit: use \`/decide accept <why>\` or \`/decide reject <why>\`."; exit 0; }
          n=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName | sed -nE 's#^agent/([0-9]+)-.*#\1#p')
          [ -n "$n" ] || exit 0
          gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx type:rfc || { echo "#$n is not an RFC"; exit 0; }
          .agentkit-kit/scripts/set-status.sh "$REPO" "$n" status:changes-requested

      # a dependency that was dropped (closed, not completed) can never unblock its dependents
      - name: Block dependents of a dropped issue
        if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason != 'completed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          AGENTKIT_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          SLACK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          affected=$(.agentkit-kit/scripts/drop-dependency.sh "$REPO" "$N" "$TITLE")
          [ -n "$affected" ] || { echo "#$N blocks no open issue"; exit 0; }
          list=""
          for d in $affected; do
            t=$(gh issue view "$d" --repo "$REPO" --json title --jq .title)
            list+="${list:+, }#$d $t"
          done
          echo "blocked: $list"
          if [ -n "$SLACK" ]; then
            text="Dropped #$N $TITLE. Blocked: $list"
            jq -n --arg t "$text" '{text: ($t | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK" >/dev/null || echo "::warning::could not post to Slack"
          fi

      # a person's "Request changes" review: the implementer's fix round reads it with its inline comments
      - id: reviewer
        if: github.event_name == 'pull_request_review'
        continue-on-error: true  # an untrusted reviewer is ignored, not an error
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ github.event.review.user.login }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]
          require-all: "true"

      - name: Send back on requested changes
        if: steps.reviewer.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          n=$(sed -nE 's#^agent/([0-9]+)-.*#\1#p' <<<"$HEAD")
          [ -n "$n" ] || exit 0
          # not a failed round. An implementer already at work has read its feedback: say so instead
          status=$(gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name | select(startswith("status:"))')
          case $status in
            status:review|status:approved|status:needs-verification|status:needs-human)
              .agentkit-kit/scripts/set-status.sh "$REPO" "$n" status:changes-requested ;;
            status:in-progress|status:changes-requested)
              gh pr comment "$PR" --repo "$REPO" --body "agentkit: the implementer is already working on this PR and has read its feedback. Request changes again after its next push." ;;
            *) echo "#$n is at '$status'; nothing to do" ;;
          esac

      - name: List ready issues
        id: ready
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          WIP: ${{ inputs.wip }}
          EVERY: ${{ inputs.debt-every }}
          DEBT: ${{ inputs.debt-label }}
          OWNER: ${{ github.repository_owner }}
          PROJECT: ${{ vars.AGENTKIT_PROJECT }}
        run: |
          # in flight = every agent issue not merged yet: PRs waiting on a person count too, so the agents never
          # stack up more PRs than people merge (each one waiting goes stale against the base)
          inflight=0
          for l in status:in-progress status:review status:changes-requested status:needs-verification status:approved; do
            c=$(gh issue list --repo "$REPO" --state open --label "$l" --json number --jq length)
            inflight=$((inflight + c))
          done
          echo "in flight: $inflight / $WIP"
          [ "$inflight" -lt "$WIP" ] || exit 0
          # debt quota: debt goes first when none of the last EVERY-1 issues taken into work (open ones in flight,
          # then the most recently closed) was debt, and last otherwise
          # ponytail: "recently closed" includes issues people closed by hand; track promotions if that skews it
          # the rule itself lives in board.py (debt-due), shared with /board; this only hands it the two lists
          due=false
          if [ "$EVERY" -gt 0 ]; then
            open=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq '[.[] | select(.pull_request | not) | [.labels[].name]]')
            closed=$(gh api "repos/$REPO/issues?state=closed&sort=updated&direction=desc&per_page=50" \
              --jq '[.[] | select(.pull_request | not)] | sort_by(.closed_at) | reverse | map({labels: [.labels[].name], closed_at, state_reason})')
            due=$(jq -n --argjson open "$open" --argjson closed "$closed" '{open: $open, closed: $closed}' \
              | .agentkit-kit/plugins/agentkit/scripts/board.py debt-due --every "$EVERY" --debt-label "$DEBT")
          fi
          echo "debt due: $due"
          # manual rank: the NUMBER field `Rank` on the Projects board. A board problem must never stop dispatching,
          # so any failure here warns and leaves every rank null (today's order)
          ranks='{}'
          if [ -n "$PROJECT" ]; then
            # shellcheck disable=SC2016  # $owner, $number and $endCursor are GraphQL variables, not shell
            if page=$(gh api graphql --paginate -f owner="$OWNER" -F number="$PROJECT" -f query='
                query($owner: String!, $number: Int!, $endCursor: String) {
                  repositoryOwner(login: $owner) { ... on ProjectV2Owner { projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        content { ... on Issue { number repository { nameWithOwner } } }
                        fieldValueByName(name: "Rank") { ... on ProjectV2ItemFieldNumberValue { number } }
                      }
                    }
                  } } }
                }' 2>&1) \
              && r=$(jq -cs --arg repo "$REPO" '[.[].data.repositoryOwner.projectV2.items.nodes[]?
                       | select(.content.repository.nameWithOwner == $repo and .fieldValueByName.number != null)
                       | {key: (.content.number | tostring), value: .fieldValueByName.number}] | from_entries' <<<"$page" 2>&1); then
              ranks=$r
            else
              msg=${r:-$page}
              echo "::warning::could not read the board's Rank field, ordering without ranks: ${msg:0:300}"
            fi
          fi
          gh api --paginate "repos/$REPO/issues?state=open&labels=status:ready&per_page=100" \
            | jq -cs --argjson ranks "$ranks" '[.[][] | select(.pull_request | not)
                   | {number, author: .user.login, labels: [.labels[].name], rank: ($ranks[.number | tostring] // null)}]' \
            | .agentkit-kit/plugins/agentkit/scripts/board.py order --debt-due "$due" --debt-every "$EVERY" --debt-label "$DEBT" >"$RUNNER_TEMP/ready.json"
          echo "authors=$(jq -r '[.[].author] | unique | join(" ")' "$RUNNER_TEMP/ready.json")" >>"$GITHUB_OUTPUT"

      # prompt-injection guard: only issues written by people with write access (or agentkit itself)
      - id: trust
        if: steps.ready.outputs.authors != ''
        uses: ./.agentkit-kit/.github/actions/trusted
        with:
          logins: ${{ steps.ready.outputs.authors }}
          token: ${{ steps.app.outputs.token }}
          bot: ${{ steps.app.outputs.app-slug }}[bot]

      - name: Promote next ready issue
        if: steps.ready.outputs.authors != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TRUSTED: ${{ steps.trust.outputs.trusted }}
          AGENTKIT_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          candidates=$(jq -r --arg t " $TRUSTED " '.[] | . as $i | select($t | contains(" \($i.author) ")) | .number' "$RUNNER_TEMP/ready.json")
          for n in $candidates; do
            # capture first so an API error stops the step (fail closed). hold.sh also moves an issue held by a
            # dropped blocker to status:blocked, so that never depends on the blocker's `closed` event alone
            hold=$(.agentkit-kit/scripts/hold.sh "$REPO" "$n")
            case "$hold" in
              go) ;;
              open\ *) echo "#$n waiting on open issue(s): ${hold#open }"; continue ;;
              blocked\ *) echo "#$n blocked: dropped dependency ${hold#blocked }"; continue ;;
              *) echo "::error::hold.sh said '$hold' for #$n"; exit 1 ;;
            esac
            .agentkit-kit/scripts/set-status.sh "$REPO" "$n" status:in-progress
            echo "promoted #$n"
            exit 0
          done
          echo "nothing ready and unblocked"
